Host antfarm-docker-runner
    HostName runner.internal
    User antfarm-runner-link
    IdentityFile /etc/antfarm/runner-link
    UserKnownHostsFile /etc/antfarm/runner-known-hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    IdentitiesOnly yes
    BatchMode yes
    ConnectTimeout 5
    ExitOnForwardFailure yes
    ServerAliveInterval 10
    ServerAliveCountMax 2
    StreamLocalBindMask 0177
    StreamLocalBindUnlink yes
    LocalForward /run/antfarm-runner-tunnel/runner.sock /run/agentrush-sandbox/runner.sock
