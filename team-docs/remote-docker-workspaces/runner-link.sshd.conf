Match User antfarm-runner-link
    AuthenticationMethods publickey
    MaxSessions 0
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    AllowStreamLocalForwarding local
    AllowTcpForwarding local
    # OpenSSH applies PermitOpen to Unix socket destinations as well.
    PermitOpen [/run/agentrush-sandbox/runner.sock]:*
Match all
