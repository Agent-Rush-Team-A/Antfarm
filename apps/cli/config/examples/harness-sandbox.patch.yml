# Optional sandbox management over the default Antfarm Web composition.
# Runner runs independently with Docker access.
# Both services use the same canonical Linux workspace root and filesystem UID.
- insert:
    - id: workspace-sandbox
      name: '@deepseek-ai/dsh-harness-sandbox'
      config:
        socketPath: !!js process.env.DSH_SANDBOX_RUNNER_SOCKET
        workspaceRoot: !!js process.env.DSH_MULTIUSER_WORKSPACE_ROOT
