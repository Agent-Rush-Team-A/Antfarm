# Antfarm's account-based Web entry, shared by the start and development commands.
- id: connection
  config:
    multiuser: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

- insert:
    - id: multiuser
      name: '@deepseek-ai/dsh-api-multiuser'
      config:
        workspaceRoot: !!js process.env.DSH_MULTIUSER_WORKSPACE_ROOT ?? process.getBuiltinModule('node:path').join(ctx.profileContext.home, 'workspaces')
    - id: user-credentials
      name: '@deepseek-ai/dsh-api-user-credentials'
      config:
        encryptionKeyFile: !!js process.env.DSH_USER_CREDENTIALS_KEY_FILE ?? process.getBuiltinModule('node:path').join(ctx.profileContext.home, 'secrets', 'user-credentials.key')
        initializeKeyIfEmpty: !!js "!process.env.DSH_USER_CREDENTIALS_KEY_FILE"
        inferenceBindings:
          - provider: vultr
            baseURL: https://api.vultrinference.com/v1
            credentialName: Vultr API Key
    - id: workspace-upload
      name: '@deepseek-ai/dsh-api-workspace-upload'
      disabled: !!js process.platform !== 'linux'
      config:
        maxBytes: 33554432
    - id: workspace-artifacts
      name: '@deepseek-ai/dsh-api-workspace-artifacts'
      disabled: !!js process.platform !== 'linux'
      config:
        maxEntries: 2000
        maxDownloadBytes: 33554432

# Public discovery uses no credential; configured models cover an unavailable first load.
- id: llm-pi-ai
  config:
    providers:
      vultr:
        displayName: Vultr
        credentialScope: request
        api: openai-completions
        baseURL: https://api.vultrinference.com/v1
        modelDiscovery:
          type: vultr
          timeoutMs: 5000
          maxResponseBytes: 4194304
          maxTokens: 8192
          cacheTtlMs: 300000
          cachePath: !!js process.getBuiltinModule('node:path').join(ctx.profileContext.home, 'cache', 'vultr-model-catalog.json')
        models:
          - id: deepseek-v4.1-flash-1017
            name: DeepSeek V4.1 Flash 1017
            contextWindow: 1048576
            maxTokens: 8192
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 1048576
            maxTokens: 8192
          - id: qwen3.8-27b
            name: Qwen 3.8 27B
            contextWindow: 262144
            maxTokens: 8192

- id: ui-user-credentials
  disabled: false

# Multiuser inference uses only account-owned credentials, including the default model.
- id: agent-default-model
  config:
    provider: vultr
    model: deepseek-v4.1-flash-1017
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
# Background title calls do not carry an authenticated user turn; retain local titles.
- id: session-title-llm
  disabled: true

# Host execution remains disabled until the sandbox execution integration in #7.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-jobs
  disabled: true
- id: terminal-controller
  disabled: true
- id: open-in-app
  disabled: true
